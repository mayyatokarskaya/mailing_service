{% extends 'mailing/base.html' %}

{% block title %}Удаление получателя{% endblock %}

{% block content %}
<h1>Удалить получателя</h1>

<p>Вы уверены, что хотите удалить <strong>{{ object.full_name }}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Подтвердить удаление</button>
    <a href="{% url 'recipient_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
