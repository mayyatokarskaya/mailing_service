<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Сервис рассылок{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'home' %}">Сервис рассылок</a>
        <div class="d-flex align-items-center gap-2">

            {% if user.is_authenticated %}

            <span class="ms-3">Привет, {{ user.username }}!</span>
            <a href="{% url 'message_list' %}" class="btn btn-outline-primary">Сообщения</a>
            <a href="{% url 'recipient_list' %}" class="btn btn-outline-primary">Получатели</a>
            <a href="{% url 'mailing_list' %}" class="btn btn-outline-primary">Рассылки</a>
            <a href="{% url 'profile' %}" class="btn btn-outline-primary">Профиль</a>

                <a href="{% url 'attempt_list' %}"class="btn btn-outline-primary" >Попытки рассылок</a>


            <form action="{% url 'logout' %}" method="post" class="d-inline ms-2">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Выйти</button>
            </form>

            {% else %}
            <a class="btn btn-success ms-3" href="{% url 'login' %}">Войти</a>
            <a class="btn btn-primary ms-2" href="{% url 'register' %}">Регистрация</a>
            {% endif %}

            {% if user.is_staff %}
            <a class="btn btn-outline-warning ms-2" href="{% url 'manager_recipient_list' %}">Все получатели</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container">
    {% block content %}{% endblock %}
</div>

</body>
</html>
