{% extends 'mailing/base.html' %}

{% block title %}Форма получателя{% endblock %}

{% block content %}
<h1>{% if object %}Редактировать{% else %}Создать{% endif %} получателя</h1>

<form method="post" class="mb-3">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Сохранить</button>
</form>

<a href="{% url 'recipient_list' %}" class="btn btn-secondary">Назад к списку</a>
{% endblock %}
